<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DepthWizard — 3D terrain viewer</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: rgba(16, 22, 30, 0.88);
    --line: rgba(255, 255, 255, 0.10);
    --text: #e6edf3;
    --dim: #8b98a5;
    --accent: #4da3ff;
    --warn: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    color: var(--text);
    font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; }

  .panel {
    position: absolute;
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  #hud { top: 12px; left: 12px; width: 268px; }
  #stats { top: 12px; right: 12px; width: 232px; }
  #help { bottom: 12px; left: 12px; color: var(--dim); }
  #readout {
    bottom: 12px; right: 12px; width: 232px; display: none;
  }

  h1 { margin: 0 0 2px; font-size: 14px; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .row span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .row span:first-child { color: var(--dim); }
  label { display: block; color: var(--dim); font-size: 11px; margin: 10px 0 4px; }
  select, button {
    width: 100%; padding: 6px 8px; border-radius: 6px; font: inherit;
    background: rgba(255,255,255,.06); color: var(--text);
    border: 1px solid var(--line); cursor: pointer;
  }
  button:hover, select:hover { background: rgba(255,255,255,.12); }
  button.on { background: var(--accent); color: #06121f; border-color: transparent; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  kbd {
    background: rgba(255,255,255,.08); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; font: 11px ui-monospace, monospace;
  }
  #legend { margin-top: 10px; display: none; }
  #legend .bar { height: 8px; border-radius: 4px; margin-bottom: 3px; }
  #legend .ends { display: flex; justify-content: space-between; color: var(--dim); font-size: 10px; }
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: var(--bg); z-index: 10; text-align: center;
  }
  .err { color: var(--warn); max-width: 520px; }
  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 14px;
    margin: -7px 0 0 -7px; pointer-events: none; display: none;
  }
  #crosshair:before, #crosshair:after {
    content: ""; position: absolute; background: rgba(255,255,255,.7);
  }
  #crosshair:before { left: 6px; top: 0; width: 2px; height: 14px; }
  #crosshair:after { top: 6px; left: 0; height: 2px; width: 14px; }
</style>
</head>
<body>
  <div id="crosshair"></div>

  <div id="hud" class="panel">
    <h1>DepthWizard</h1>
    <div class="sub">Single-image DSM · 3D flythrough</div>

    <label for="scene">Scene</label>
    <select id="scene"></select>

    <label for="mode">Surface</label>
    <select id="mode">
      <option value="texture">Satellite drape</option>
      <option value="height">Height (colour ramp)</option>
      <option value="sigma">Uncertainty (± metres)</option>
      <option value="slope">Slope</option>
    </select>

    <label for="vex">Vertical exaggeration · <span id="vexv">1.0×</span></label>
    <input id="vex" type="range" min="0.5" max="6" step="0.1" value="1.5" />

    <div class="btns">
      <button id="tour">Auto tour</button>
      <button id="measure">Measure</button>
    </div>
    <div class="btns">
      <button id="wire">Wireframe</button>
      <button id="reset">Reset view</button>
    </div>

    <div id="legend">
      <div class="bar"></div>
      <div class="ends"><span id="legmin"></span><span id="legmax"></span></div>
    </div>
  </div>

  <div id="stats" class="panel">
    <div class="row"><span>Extent</span><span id="s-extent">—</span></div>
    <div class="row"><span>Resolution</span><span id="s-res">—</span></div>
    <div class="row"><span>GSD</span><span id="s-gsd">—</span></div>
    <div class="row"><span>Height range</span><span id="s-range">—</span></div>
    <div class="row"><span>Mean σ</span><span id="s-sigma">—</span></div>
    <div class="row"><span>Mesh</span><span id="s-mesh">—</span></div>
    <div class="row"><span>FPS</span><span id="s-fps">—</span></div>
  </div>

  <div id="readout" class="panel">
    <div class="row"><span>Ground distance</span><span id="m-ground">—</span></div>
    <div class="row"><span>Height difference</span><span id="m-dh">—</span></div>
    <div class="row"><span>Slope distance</span><span id="m-slope">—</span></div>
    <div class="row"><span>Uncertainty</span><span id="m-unc">—</span></div>
    <div class="row sub"><span id="m-note"></span></div>
  </div>

  <div id="help" class="panel">
    <kbd>Click</kbd> look · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move ·
    <kbd>Q</kbd><kbd>E</kbd> down/up · <kbd>Shift</kbd> sprint · <kbd>Esc</kbd> release
  </div>

  <div id="loading"><div>Loading…</div></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
